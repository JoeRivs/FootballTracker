services:
  backend:
    build: ./backend
    container_name: ft_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ft_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
